<!DOCTYPE html>
<!-- UNIMAP - PROYECTO INNOVATEC
     MAPA INTERACTIVO DEL INSTITUTO TECNOLÓGICO DE LA LAGUNA (ITL)
     DESARROLLADO POR JUAN PABLO CHÁVEZ RAMÍREZ Y ÁNGEL DANIEL SALINAS ORTIZ
     EN COLABORACIÓN CON MIGUEL ESPARZA
     TECNOLOGÍAS OPEN SOURCE: LEAFLET & QGIS
-->
<html lang="es">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>UNIMAP - Mapa Interactivo ITL</title>
    <meta name="description" content="Mapa interactivo del campus ITL (Instituto Tecnológico de La Laguna) con búsqueda de aulas, edificios y soporte PWA offline." />
    
    <!-- PWA & Metadatos Móviles -->
    <link rel="manifest" href="manifest.json" />
    <meta name="theme-color" content="#1a365d" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <link rel="icon" type="image/png" href="img/logo-tecnm.png" />
    <link rel="apple-touch-icon" href="img/logo-192.png" />

    <!-- Leaflet Open Source CSS & JS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha384-sHL9NAb7lN7rfvG5lfHpm643Xkcjzp4jFvuavGOndn6pjVqS6ny56CAt3nsEVT4H" crossorigin="" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha384-cxOPjt7s7Iz04uaHJceBmS+qpjv2JkIHNVcuOrM+YHwZOmJGBXI00mdUXEq65HTH" crossorigin=""></script>

    <!-- Geometría del Campus (Polígonos procesados con QGIS) -->
    <script src="json/GeoTec.js"></script>

    <!-- Estilos de la Aplicación -->
    <link rel="stylesheet" href="css/styles.css" />

    <style>
        body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        html, body, #map {
            width: 100%;
            height: 100%;
        }
        /* Indicador de estado offline / online */
        .network-badge {
            position: fixed;
            top: 20px;
            left: 20px;
            z-index: 1000;
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(8px);
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 6px;
            box-shadow: 0 2px 6px rgba(0,0,0,0.2);
            transition: all 0.3s ease;
        }
        .network-badge .dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background-color: #4CAF50;
        }
        .network-badge.offline .dot {
            background-color: #f44336;
        }
        @media (max-width: 768px) {
            .network-badge {
                top: 10px;
                left: 10px;
                font-size: 11px;
                padding: 4px 8px;
            }
        }
    </style>
</head>

<body>
    <!-- Mapa Leaflet Principal -->
    <div id="map"></div>

    <!-- Indicador de conexión / offline -->
    <div id="network-status" class="network-badge">
        <span class="dot"></span>
        <span id="network-text">PWA Lista</span>
    </div>

    <!-- Barra de Búsqueda de Edificios y Aulas -->
    <div class="searchbar-container">
        <div class="searchbar-input-wrapper">
            <input 
                type="text" 
                id="searchbar-input" 
                class="searchbar-input" 
                placeholder="Buscar edificio o aula (ej: 19L, Edificio 19)..." 
                autocomplete="off"
            />
            <button type="button" class="searchbar-button" id="search-btn" title="Buscar">🔍</button>
            <div id="searchbar-suggestions" class="searchbar-suggestions"></div>
        </div>
    </div>

    <!-- Lógica Principal del Mapa -->
    <script src="js/main.js"></script>

    <!-- Registro de Service Worker para PWA Offline -->
    <script>
        function actualizarEstadoRed() {
            var badge = document.getElementById('network-status');
            var text = document.getElementById('network-text');
            if (navigator.onLine) {
                badge.classList.remove('offline');
                text.textContent = 'PWA Lista';
            } else {
                badge.classList.add('offline');
                text.textContent = 'Modo Offline';
            }
        }

        window.addEventListener('online', actualizarEstadoRed);
        window.addEventListener('offline', actualizarEstadoRed);

        if ('serviceWorker' in navigator) {
            window.addEventListener('load', function () {
                navigator.serviceWorker.register('./sw.js')
                    .then(function (reg) {
                        console.log('UNIMAP Service Worker registrado con éxito:', reg.scope);
                        actualizarEstadoRed();
                    })
                    .catch(function (err) {
                        console.error('Error al registrar Service Worker:', err);
                    });
            });
        }
    </script>
</body>
</html>
