<!DOCTYPE html>
<html>

<head>
    <title>Mapa Interactivo ITL</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
        integrity="sha384-sHL9NAb7lN7rfvG5lfHpm643Xkcjzp4jFvuavGOndn6pjVqS6ny56CAt3nsEVT4H" crossorigin="" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
        integrity="sha384-cxOPjt7s7Iz04uaHJceBmS+qpjv2JkIHNVcuOrM+YHwZOmJGBXI00mdUXEq65HTH" crossorigin=""></script>
    <script src="GeoTec.js"></script>
    <style type="text/css">
        body {
            margin: 0;
            padding: 0;
        }

        html,
        body,
        #map {
            width: 100%;
            height: 100%;
        }
    </style>
    <link rel="stylesheet" href="styles.css">
    <link rel="icon" type="image/x-icon" href="img/logo-tecnm.png">
</head>

<body>
    <div id="map"> </div>
    <div class="searchbar-container">
        <div class="searchbar-input-wrapper">
            <input type="text" id="searchbar-input" class="searchbar-input"
                placeholder="Buscar edificio o aula (ej: 19L, Edificio 19)..." autocomplete="off">
            <button type="button" class="searchbar-button" id="search-btn">🔍</button>
            <div id="searchbar-suggestions" class="searchbar-suggestions"></div>
        </div>
    </div>

    <div class="location-controls">
        <button type="button" id="center-location-btn" class="location-button">Centrar</button>
    </div>

    <!-- Panel de Puertas de Acceso (Esquina inferior izquierda) -->
    <div class="doors-panel-container">
        <label class="doors-panel-title" for="doors-select">Puertas de Acceso</label>
        <select id="doors-select" class="doors-select">
            <option value="" disabled selected>Selecciona una puerta...</option>
            <option value="P1">Puerta 1 (Norte - Gestión)</option>
            <option value="P2">Puerta 2 (Norte - Admin)</option>
            <option value="P3">Puerta 3 (Este - Alberca)</option>
            <option value="P4">Puerta 4 (Sur - Gimnasio)</option>
            <option value="P5">Puerta 5 (Sur - Béisbol)</option>
            <option value="P6">Puerta 6 (Oeste - Aulas)</option>
        </select>
    </div>

    <!-- Scripts Modulares -->
    <script src="js/beacons-simulation.js"></script>
    <script src="js/pathfinding.js"></script>
    <script src="js/main.js"></script>
</body>

</html>;
